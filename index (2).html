<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Intercambio Navideño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
/* Plan: una posada de noche. Fondo verde pino; el contenido vive en papel crema
   (etiquetas de regalo colgadas y hojas). El papel picado de arriba es el unico
   lugar con todos los colores; el resto usa rojo nochebuena y oro con mesura. */
:root{
  --pino:#12352b;
  --pino-hondo:#0c261f;
  --pino-luz:#1f5444;
  --papel:#fbf2de;
  --papel-raya:#dccba6;
  --tinta:#2a2118;
  --tinta-suave:#6b5a45;
  --rojo:#c9283b;
  --rojo-hondo:#a31d2e;
  --oro:#e9ae3a;
  --rosa:#e2578a;
  --menta:#58ac89;
  --bien-fondo:#d6ecdf; --bien-texto:#1c5a3c;
  --espera-fondo:#fbe6b4; --espera-texto:#76500a;
  --display:'Yeseva One', Georgia, 'Times New Roman', serif;
  --cuerpo:'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mano:'Caveat', 'Segoe Script', 'Bradley Hand', cursive;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1100px 460px at 50% -120px, var(--pino-luz) 0%, transparent 72%), var(--pino);
  background-color:var(--pino);
  color:var(--papel);
  font-family:var(--cuerpo);
  font-size:1rem;
  line-height:1.5;
  min-height:100%;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

.picado{display:flex;justify-content:center;gap:5px;height:62px;overflow:hidden;border-top:3px solid var(--oro)}
.picado svg{flex:0 0 52px;width:52px;height:62px;fill:currentColor;transform-origin:50% 0;animation:mecer 4.6s ease-in-out infinite alternate}
.picado svg:nth-child(5n+1){color:var(--rojo)}
.picado svg:nth-child(5n+2){color:var(--oro)}
.picado svg:nth-child(5n+3){color:var(--papel)}
.picado svg:nth-child(5n+4){color:var(--rosa)}
.picado svg:nth-child(5n+5){color:var(--menta)}
.picado svg:nth-child(2n){animation-delay:-1.5s}
.picado svg:nth-child(3n){animation-delay:-3.1s}
@keyframes mecer{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}

.marco{max-width:1080px;margin:0 auto;padding:0 20px 56px}

.cabecera{padding:30px 0 22px;display:grid;gap:14px}
.ceja{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.cabecera h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,7.2vw,4.4rem);line-height:.98;text-wrap:balance;overflow-wrap:anywhere}
.datos{display:flex;flex-wrap:wrap;gap:8px}
.datos li{border:1px solid rgba(251,242,222,.28);border-radius:999px;padding:6px 14px;font-size:.92rem}
.datos span{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);margin-right:8px}

.pestanas{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:18px}
.pestana{padding:9px 18px;border-radius:999px;border:1.5px solid rgba(251,242,222,.38);color:var(--papel);text-decoration:none;font-weight:600;font-size:.95rem}
.pestana:hover{border-color:var(--papel)}
.pestana[aria-current="page"]{background:var(--papel);border-color:var(--papel);color:var(--pino)}

.barra{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:22px;padding:10px 16px;border-radius:14px;background:var(--pino-hondo);border:1px dashed rgba(233,174,58,.55);font-size:.92rem}
.barra[hidden]{display:none}
.barra.pendiente{background:var(--oro);border-color:var(--oro);color:var(--tinta);color-scheme:light}
.barra .lado{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.barra .menor{opacity:.8}

h2{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.2;text-wrap:balance}
.bajada{max-width:60ch;opacity:.86}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:26px}
.intro > div{display:grid;gap:6px}

.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:0;border-radius:999px;background:var(--rojo);color:#fff;font-weight:600;font-size:.95rem;line-height:1.2;text-decoration:none;cursor:pointer}
.boton:hover{background:var(--rojo-hondo)}
.boton.claro{background:var(--papel);color:var(--pino)}
.boton.claro:hover{background:#fff}
.boton.sec{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1.5px rgba(42,33,24,.4)}
.boton.sec:hover{background:rgba(42,33,24,.07)}
.boton.wa{background:#1d7f55}
.boton.wa:hover{background:#166443}
.boton.chico{padding:7px 13px;font-size:.85rem}
.boton[disabled],.boton[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.enlace{background:none;border:0;padding:0;color:inherit;font-weight:600;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.etiquetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:34px 22px;padding-top:14px}
.colgada{position:relative;filter:drop-shadow(0 10px 12px rgba(0,0,0,.36));transform:rotate(var(--giro,0deg));transform-origin:50% 0;transition:transform .35s ease}
.colgada:nth-child(4n+1){--giro:-1.3deg}
.colgada:nth-child(4n+2){--giro:.9deg}
.colgada:nth-child(4n+3){--giro:-.5deg}
.colgada:nth-child(4n+4){--giro:1.4deg}
.colgada:hover,.colgada:focus-within{transform:rotate(0deg)}
.colgada::before{content:"";position:absolute;left:50%;top:-16px;width:2px;height:34px;margin-left:-1px;background:var(--oro);z-index:1}
.etiqueta{position:relative;height:100%;background:var(--papel);color:var(--tinta);color-scheme:light;padding:48px 20px 16px;border-radius:0 0 14px 14px;clip-path:polygon(30px 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%,0 30px)}
.etiqueta::before{content:"";position:absolute;left:50%;top:13px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--pino);box-shadow:0 0 0 3px var(--oro)}
.eti-ceja{text-align:center;font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-suave)}
.eti-nombre{font-family:var(--mano);font-weight:700;font-size:2.5rem;line-height:1;text-align:center;color:var(--rojo);padding:2px 0 10px;margin-bottom:6px;border-bottom:1.5px dashed var(--papel-raya);overflow-wrap:anywhere}
.eti-lista li{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid rgba(42,33,24,.1)}
.eti-lista li:last-child{border-bottom:0}
.eti-lista .num{font-family:var(--display);color:var(--rojo);font-size:.95rem;line-height:1.5}
.eti-lista a,.eti-lista .sin-link{font-weight:600;overflow-wrap:anywhere}
.eti-lista a{text-decoration:underline;text-decoration-color:var(--rojo);text-decoration-thickness:1.5px;text-underline-offset:3px}
.eti-lista a:hover{color:var(--rojo-hondo)}
.dominio{display:block;font-size:.78rem;color:var(--tinta-suave);overflow-wrap:anywhere}
.vacio{font-family:var(--mano);font-size:1.35rem;line-height:1.2;text-align:center;color:var(--tinta-suave);padding:14px 0 10px}
.eti-cuenta{text-align:right;font-size:.74rem;color:var(--tinta-suave);font-variant-numeric:tabular-nums;padding-top:6px}

.hoja{background:var(--papel);color:var(--tinta);color-scheme:light;border-radius:18px;padding:24px;display:grid;gap:16px;align-content:start}
.hoja .bajada{opacity:1;color:var(--tinta-suave)}
.pila{display:grid;gap:20px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px;align-items:start}
.muro .hoja{margin-bottom:34px}

.campo{display:grid;gap:5px;font-size:.82rem;font-weight:600;color:var(--tinta-suave);min-width:0}
.campo input,.campo select,.campo textarea{width:100%;min-width:0;padding:10px 12px;border:1.5px solid var(--papel-raya);border-radius:10px;background:#fffdf7;color:var(--tinta);font-size:1rem;font-weight:400}
.campo textarea{min-height:120px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--rojo);outline:none;box-shadow:0 0 0 3px rgba(201,40,59,.18)}
.campo input:disabled{background:transparent;border-style:dashed;color:var(--tinta)}
.campo .nota{font-weight:400;font-size:.78rem}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.fila-deseo{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:end}
.fila-deseo .num{font-family:var(--display);color:var(--rojo);padding-bottom:10px}
.acciones{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.error{color:var(--rojo-hondo);font-weight:600;font-size:.9rem}
.error:empty{display:none}
.nota{font-size:.85rem;color:var(--tinta-suave)}
.caja-aviso{background:var(--espera-fondo);color:var(--espera-texto);border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}

.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;counter-reset:paso}
.pasos li{counter-increment:paso;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:12px;border-radius:12px;border:1.5px solid var(--papel-raya);font-size:.9rem;line-height:1.35}
.pasos li::before{content:counter(paso);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--tinta);color:var(--papel);font-family:var(--display);font-size:.95rem}
.pasos li.hecho{background:var(--bien-fondo);border-color:transparent;color:var(--bien-texto)}
.pasos li.hecho::before{content:"\2713";background:var(--bien-texto);color:#fff;font-family:var(--cuerpo);font-weight:700}

.pastilla{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pastilla.bien{background:var(--bien-fondo);color:var(--bien-texto)}
.pastilla.espera{background:var(--espera-fondo);color:var(--espera-texto)}
.envios li{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(42,33,24,.12)}
.envios li:last-child{border-bottom:0}
.envios .quien{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.envios .acciones{justify-content:flex-end}
.envios .manual{grid-column:1/-1}
.conteo{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.conteo small{font-family:var(--cuerpo);font-size:.88rem;color:var(--tinta-suave);margin-left:8px}

.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{padding:6px 13px;border-radius:999px;border:1.5px solid var(--papel-raya);background:transparent;color:var(--tinta);font-weight:600;font-size:.88rem;cursor:pointer}
.ficha[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.ficha .cuantos{font-weight:400;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
.persona{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:6px 0}
.lista-simple li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(42,33,24,.1)}
details > summary{cursor:pointer;font-weight:600}
details[open] > summary{margin-bottom:12px}
details .dentro{display:grid;gap:12px}

.sobre{max-width:560px;margin:0 auto}
.codigo{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace !important;font-size:1.5rem !important;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.revelado{max-width:440px;margin:30px auto 0;animation:caer .9s cubic-bezier(.2,.9,.3,1.15) both}
.revelado .colgada{--giro:0deg}
.revelado .eti-nombre{font-size:3.6rem;padding-bottom:14px}
.revelado .pie-eti{display:grid;gap:10px;justify-items:center;padding-top:12px;text-align:center}
@keyframes caer{0%{opacity:0;transform:translateY(-46px) rotate(-8deg)}55%{opacity:1;transform:translateY(0) rotate(3deg)}100%{transform:none}}

.pie{padding-top:40px;font-size:.84rem;opacity:.7;max-width:62ch}
.tostada{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--papel);color:var(--tinta);border-radius:999px;padding:10px 20px;font-weight:600;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:20}
.tostada[hidden]{display:none}

@media (max-width:520px){
  .hoja{padding:18px 16px}
  .fila-deseo{grid-template-columns:22px minmax(0,1fr)}
  .fila-deseo .campo:last-child{grid-column:2}
  .persona{grid-template-columns:minmax(0,1fr) auto}
  .persona .campo:nth-child(2){grid-column:1/-1;grid-row:2}
  .envios li{grid-template-columns:1fr}
  .envios .acciones{justify-content:flex-start}
  .picado{height:50px}
  .picado svg{flex-basis:42px;width:42px;height:50px}
}
@media (prefers-reduced-motion:reduce){
  .picado svg,.revelado{animation:none}
  .colgada{transition:none}
}

/* --- version GitHub Pages + Supabase --- */
.barra.falla{background:#5b1620;border-color:#e58794;border-style:solid}
.saludo{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.revelado{margin-top:0}
.entrada{display:grid;gap:26px}
.pie .enlace{font-size:inherit;font-weight:400}
.envios .codigo-mini{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.8rem;font-weight:400;color:var(--tinta-suave);letter-spacing:.06em}
.cargando{font-family:var(--mano);font-size:1.5rem;opacity:.85;padding:10px 0 30px}
</style>
</head>
<body>
<div id="raiz"></div>
<noscript><p style="padding:24px">Esta página necesita JavaScript para funcionar.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>(function () {
'use strict';

var MAX_DESEOS = 5;
var CFG = window.INTERCAMBIO_CONFIG || {};
var URL_BASE = String(CFG.url || '').trim().replace(/\/+$/, '');
var LLAVE = String(CFG.llave || '').trim();
var configurado = /^https:\/\/[^\s/]+\.[^\s/]+$/.test(URL_BASE) && URL_BASE.indexOf('TU-PROYECTO') < 0 &&
  LLAVE.length > 20 && LLAVE.indexOf('PEGA_AQUI') < 0;
var cliente = null;
try {
  if (configurado && window.supabase && window.supabase.createClient) cliente = window.supabase.createClient(URL_BASE, LLAVE);
} catch (e) { cliente = null; }

/* ---------- utilidades ---------- */
function agregar(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { agregar(e, x); }); return; }
  e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
}
function el(tag, attrs) {
  var e = document.createElement(tag), k, v, i;
  if (attrs) for (k in attrs) {
    v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (i = 2; i < arguments.length; i++) agregar(e, arguments[i]);
  return e;
}
function campo(etiqueta, control, nota) {
  return el('label', { class: 'campo' }, etiqueta, control, nota ? el('span', { class: 'nota', text: nota }) : null);
}
function guardarLocal(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function leerLocal(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function limpiarCodigo(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function formatoCodigo(c) { c = String(c || ''); return c.slice(0, 4) + '-' + c.slice(4); }
function normalizarUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) { if (/\s/.test(u) || u.indexOf('.') < 0) return null; u = 'https://' + u; }
  try { var x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : null; } catch (e) { return null; }
}
function dominio(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function fechaLarga(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  if (!m) return '';
  var d = new Date(+m[1], +m[2] - 1, +m[3], 12);
  try { return d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return m[0]; }
}
function enlaceWa(tel, texto) {
  var n = String(tel || '').replace(/\D/g, '');
  if (n.length === 10) n = '52' + n;
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
}
function enlacePagina() { return location.origin + location.pathname; }
function datosEvento(ev) {
  var l = [];
  if (ev.fecha) l.push('Fecha: ' + fechaLarga(ev.fecha));
  if (ev.lugar) l.push('Lugar: ' + ev.lugar);
  if (ev.presupuesto) l.push('Presupuesto: ' + ev.presupuesto);
  return l;
}
function mensajeCodigo(nombre, codigo, ev) {
  var l = ['🎄 ¡Hola, ' + nombre + '! Este es tu código personal para ' + (ev.nombre || 'nuestro intercambio') + ':', '',
    formatoCodigo(codigo), '',
    '1. Entra a ' + enlacePagina(),
    '2. Toca "Entrar con mi código" y escríbelo.', '',
    'Con él armas tu lista de deseos (hasta ' + MAX_DESEOS + ' regalos) y, cuando se haga el sorteo, ves a quién le regalas. No lo compartas con nadie 🤫'];
  var extra = datosEvento(ev);
  if (extra.length) { l.push(''); l = l.concat(extra); }
  return l.join('\n');
}
function mensajeSorteo(ev) {
  var l = ['🎁 ¡Ya se hizo el sorteo de ' + (ev.nombre || 'nuestro intercambio') + '!', '',
    'Entra a ' + enlacePagina() + ', toca "Entrar con mi código" y descubre a quién le regalas. Ahí mismo ves su lista de deseos.'];
  var extra = datosEvento(ev);
  if (extra.length) { l.push(''); l = l.concat(extra); }
  return l.join('\n');
}
function rpc(fn, args) {
  return cliente.rpc(fn, args || {}).then(function (r) { if (r.error) throw r.error; return r.data; });
}
function mensajeError(e) {
  var m = (e && e.message) || '', c = (e && e.code) || '';
  if (/Failed to fetch|NetworkError|Load failed|fetch/i.test(m) && !c) return 'No hay respuesta de la base de datos. Revisa tu conexión e inténtalo de nuevo.';
  if (c === 'PGRST202' || c === '42883') return 'La base de datos aún no está instalada o está incompleta. Vuelve a ejecutar base-de-datos.sql en Supabase.';
  if (c === '42501' || /permission denied|No autorizado/i.test(m)) return 'Esta sesión no tiene permiso para eso. Cierra sesión y vuelve a entrar.';
  if (/JWT|token/i.test(m)) return 'Tu sesión venció. Cierra sesión y vuelve a entrar.';
  if (c === 'P0001' && m) return m;
  return m || 'Algo falló. Inténtalo de nuevo.';
}

/* ---------- estado ---------- */
var S = {
  tab: 'muro',
  muro: null, cargaMuro: 'cargando', errorMuro: '',
  codigo: '', yo: null, errorCodigo: '', entrando: false, estrenar: false, errorLista: '', guardandoLista: false,
  sesion: null, admin: null, cargaPanel: 'no', errorLogin: '', entrandoPanel: false,
  guardado: 'ok', errorPanel: '', editando: null, confirma: null, sorteando: false, manual: {}
